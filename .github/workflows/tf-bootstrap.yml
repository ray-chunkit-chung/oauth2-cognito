name: Terraform Bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: Create Terraform Backend
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BUCKET_NAME: rcoauth2-terraform-state
      DYNAMO_TABLE: rcoauth2-terraform-locks
    steps:
      - name: Create S3 Bucket
        run: |
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket $BUCKET_NAME already exists, skipping creation."
          else
            echo "Creating S3 bucket: $BUCKET_NAME"
            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi

      - name: Enable Versioning
        run: |
          echo "Enabling versioning on $BUCKET_NAME"
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled

      - name: Enable Encryption
        run: |
          echo "Enabling default encryption on $BUCKET_NAME"
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration '{
              "Rules": [{ "ApplyServerSideEncryptionByDefault": { "SSEAlgorithm": "AES256" } }]
            }'

      - name: Block Public Access
        run: |
          echo "Blocking public access on $BUCKET_NAME"
          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }'

      - name: Create DynamoDB Lock Table
        run: |
          if aws dynamodb describe-table --table-name "$DYNAMO_TABLE" --region "$AWS_REGION" 2>/dev/null; then
            echo "DynamoDB table $DYNAMO_TABLE already exists, skipping creation."
          else
            echo "Creating DynamoDB table: $DYNAMO_TABLE"
            aws dynamodb create-table \
              --table-name "$DYNAMO_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
            echo "Waiting for table to become active..."
            aws dynamodb wait table-exists --table-name "$DYNAMO_TABLE" --region "$AWS_REGION"
          fi

      - name: Summary
        run: |
          echo "## Terraform Backend Bootstrap Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: $BUCKET_NAME (versioned, encrypted)" >> $GITHUB_STEP_SUMMARY
          echo "- **DynamoDB Table**: $DYNAMO_TABLE" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: $AWS_REGION" >> $GITHUB_STEP_SUMMARY
