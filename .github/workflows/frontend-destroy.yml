name: Frontend Destroy

on:
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy Frontend Resources
    runs-on: ubuntu-latest
    env:
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read S3 bucket name from SSM
        id: ssm
        run: |
          echo "s3_bucket=$(aws ssm get-parameter --name /rcoauth2/frontend/s3-bucket-name --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      - name: Delete all S3 object versions
        run: |
          BUCKET="${{ steps.ssm.outputs.s3_bucket }}"
          echo "Deleting all versions from $BUCKET"
          aws s3api list-object-versions --bucket "$BUCKET" --output json \
            --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
            | jq -c 'select(.Objects != null)' \
            | while read -r batch; do
                aws s3api delete-objects --bucket "$BUCKET" --delete "$batch"
              done
          echo "Deleting all delete markers from $BUCKET"
          aws s3api list-object-versions --bucket "$BUCKET" --output json \
            --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
            | jq -c 'select(.Objects != null)' \
            | while read -r batch; do
                aws s3api delete-objects --bucket "$BUCKET" --delete "$batch"
              done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/frontend
        run: terraform init

      - name: Terraform Destroy
        working-directory: infra/frontend
        run: terraform destroy -auto-approve
